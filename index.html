<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#233c24">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Granulando">
  <title>Casspet® - Granulando</title>
  <!-- Instalar como app: nome, icones e tela cheia vem do manifest. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icone/icone-192.png">
  <link rel="apple-touch-icon" href="assets/icone/icone-apple.png">
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      /* Evita puxar para atualizar, selecao de texto e o flash azul do toque. */
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    #jogo {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    canvas {
      display: block;
      touch-action: none;
    }
  </style>
</head>
<body>
  <div id="jogo"></div>
  <!-- Se algum erro travar o jogo, mostra o motivo (para mandar print) e um botao para recarregar. -->
  <div id="erro" hidden style="position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%);z-index:9;
    padding:18px;border-radius:14px;background:#3b2418;border:2px solid #ffe1a6;color:#ffe1a6;
    font:15px/1.4 Arial,sans-serif;text-align:center">
    <b style="font-size:18px">O jogo travou</b>
    <p id="erro-texto" style="margin:10px 0 14px;font-size:12px;color:#f4ddc9;word-break:break-word"></p>
    <button type="button" onclick="location.reload()" style="font:bold 16px Arial,sans-serif;color:#4d2710;
      background:#f4c58a;border:2px solid #4d2710;border-radius:10px;padding:10px 22px">RECARREGAR</button>
  </div>
  <script>
    window.addEventListener('error', function (evento) {
      var caixa = document.getElementById('erro');
      if (!caixa.hidden) return;
      document.getElementById('erro-texto').textContent =
        (evento.message || 'erro desconhecido') + (evento.lineno ? ' (linha ' + evento.lineno + ')' : '');
      caixa.hidden = false;
    });
    // Guarda o convite de instalar do navegador para o botao Instalar do menu.
    window.pedidoInstalar = null;
    window.addEventListener('beforeinstallprompt', function (evento) {
      evento.preventDefault();
      window.pedidoInstalar = evento;
    });
    // Deixa o jogo abrir sem internet depois da primeira visita.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90/dist/phaser.min.js" crossorigin="anonymous"></script>
  <script src="GameV2.js?v=casspet-24"></script>
</body>
</html>
